name: Test game logic
# Pages is served straight from the main branch (Settings → Pages → Deploy from a branch),
# so this workflow only guards the game rules.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: cocos
