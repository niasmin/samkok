<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>ขุนพลสามก๊ก</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;500;600;700&family=Chonburi&family=Ma+Shan+Zheng&display=swap">
<style>
/* Layout: one phone-shaped lacquer cabinet. Parchment panels sit in a red-lacquer frame; every general is a brush-ink seal, not a stock portrait. */
:root{
  --ink:#1a110c;
  --lacquer:#4b150f;
  --lacquer-2:#6d2418;
  --gold:#d4a446;
  --gold-hi:#f2d88e;
  --parchment:#f0e2c0;
  --parchment-2:#ddc89a;
  --on-parch:#3a2416;
  --muted:#8c6e4c;
  --wei:#2e5d8e;
  --shu:#3b7b4a;
  --wu:#a6392b;
  --qun:#684a8e;
  --good:#5aa957;
  --bad:#d4523d;
  --f-display:'Chonburi','Bai Jamjuree',Georgia,serif;
  --f-body:'Bai Jamjuree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-seal:'Ma Shan Zheng','Noto Serif SC','Songti SC','SimSun',serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  margin:0;background:var(--ink);color:var(--parchment);font-family:var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;overflow:hidden;-webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
#app{
  max-width:460px;height:100%;margin:0 auto;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--lacquer) 0%,#3a100b 100%);
  border-left:3px solid #2a0a06;border-right:3px solid #2a0a06;position:relative;
}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:10px 12px 8px;border-bottom:2px solid var(--gold);background:linear-gradient(180deg,var(--lacquer-2),var(--lacquer))}
.avatar{width:44px;height:44px;border-radius:8px;background:var(--parchment);color:var(--wu);display:grid;place-items:center;font:44px/1 var(--f-seal);font-size:32px;border:2px solid var(--gold);flex:none}
.who{min-width:0;flex:1}
.who b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.power{font:15px var(--f-display);color:var(--gold-hi);font-variant-numeric:tabular-nums}
.power small{font:500 11px var(--f-body);color:var(--parchment-2);margin-right:4px}
.cur{display:flex;flex-direction:column;gap:3px;align-items:flex-end}
.pill{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.35);border:1px solid rgba(212,164,70,.45);border-radius:999px;padding:1px 9px 1px 4px;font-size:12px;font-variant-numeric:tabular-nums;min-width:86px;justify-content:space-between}
.coin{width:14px;height:14px;border-radius:50%;flex:none}
.coin.g{background:radial-gradient(circle at 35% 35%,#fff3b0,#d9a530 60%,#8a5d12)}
.coin.j{background:radial-gradient(circle at 35% 35%,#d6fff0,#3fbf8f 55%,#17604a);border-radius:3px;transform:rotate(45deg) scale(.85)}
.coin.x{background:radial-gradient(circle at 35% 35%,#e9e0ff,#8d6cd8 60%,#3f2a7a)}

/* main */
main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:12px}
.panel{background:var(--parchment);color:var(--on-parch);border-radius:10px;border:2px solid var(--gold);box-shadow:inset 0 0 0 3px var(--parchment-2)}
.h{font:20px/1.2 var(--f-display);color:var(--gold-hi);margin:2px 0 10px;text-wrap:balance}
.sub{font-size:12px;color:var(--parchment-2)}

/* bottom nav */
nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:2px solid var(--gold);background:linear-gradient(180deg,#5a1a12,#2c0c08);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{padding:7px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--parchment-2);position:relative}
nav button i{font:normal 24px/1 var(--f-seal);color:var(--parchment-2)}
nav button[aria-current="page"]{color:var(--gold-hi)}
nav button[aria-current="page"] i{color:var(--gold-hi);text-shadow:0 0 10px rgba(242,216,142,.6)}
.dot{position:absolute;top:5px;right:calc(50% - 20px);width:9px;height:9px;border-radius:50%;background:var(--bad);border:1.5px solid var(--parchment)}

/* campaign */
.scene{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:12px;overflow:hidden;border:2px solid var(--gold);
  background:
   radial-gradient(ellipse 60% 30% at 50% 78%,rgba(240,226,192,.55),transparent 70%),
   linear-gradient(180deg,#d9c7a0 0%,#cbb68a 45%,#9c8a5e 46%,#7d7048 100%)}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
.stage-tag{position:absolute;left:10px;top:10px;background:rgba(26,17,12,.78);color:var(--gold-hi);border:1px solid var(--gold);border-radius:6px;padding:3px 9px;font:15px var(--f-display)}
.march{position:absolute;left:0;right:0;bottom:12%;display:flex;justify-content:center;gap:6px}
.march .tok{animation:bob 1.1s ease-in-out infinite}
.march .tok:nth-child(2){animation-delay:.15s}.march .tok:nth-child(3){animation-delay:.3s}.march .tok:nth-child(4){animation-delay:.45s}.march .tok:nth-child(5){animation-delay:.6s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.tok{width:42px;height:42px;border-radius:8px;display:grid;place-items:center;font:28px/1 var(--f-seal);color:#fff8e6;border:2px solid var(--gold);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.loot{position:absolute;font-size:12px;font-weight:700;color:#7a4d0a;animation:rise 1.6s ease-out forwards;pointer-events:none}
@keyframes rise{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-40px)}}
.afk{margin-top:12px;padding:12px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.chest{width:52px;height:44px;border-radius:6px 6px 4px 4px;background:linear-gradient(180deg,#a5541c 0 40%,#7a3a12 40%);border:2px solid #4a230a;position:relative}
.chest::after{content:"";position:absolute;left:50%;top:34%;width:10px;height:12px;margin-left:-5px;background:var(--gold);border-radius:2px;border:1px solid #6b4a10}
.afk .t{font:18px var(--f-display);font-variant-numeric:tabular-nums}
.afk .r{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.btn{border-radius:10px;padding:10px 16px;font-weight:700;background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#3a1f08;border:2px solid #7a5512;box-shadow:0 3px 0 #6b4410}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #6b4410}
.btn[disabled]{filter:grayscale(.8);opacity:.6;cursor:not-allowed}
.btn.red{background:linear-gradient(180deg,#d9573f,#9c2a1c);color:#fff4dc;border-color:#4b120a;box-shadow:0 3px 0 #3a0c06}
.btn.ghost{background:rgba(0,0,0,.25);color:var(--parchment);border-color:rgba(212,164,70,.5);box-shadow:none}
.challenge{margin-top:12px;display:flex;gap:12px;align-items:center}
.challenge .btn{flex:1;font:22px var(--f-display);padding:12px}
.foes{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.foes .tok{width:30px;height:30px;font-size:20px;border-width:1.5px;filter:saturate(.6) brightness(.8)}
.note{font-size:12px;color:var(--parchment-2);margin-top:10px;line-height:1.55}

/* hero cards */
.card{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:3/4;max-width:100%;border:2px solid #a9a3b8;background:var(--c);display:flex;flex-direction:column;cursor:pointer;text-align:center}
.card.S{border-color:var(--gold)}
.card.SP{border-color:#ff9a5a;box-shadow:0 0 0 1px #ffd78a,0 0 12px rgba(255,140,70,.55)}
.card .seal{flex:1;display:grid;place-items:center;font:clamp(34px,11vw,48px)/1 var(--f-seal);color:#fff8e6;text-shadow:0 2px 0 rgba(0,0,0,.35);
  background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.22),transparent 60%)}
.card .rar{position:absolute;top:3px;left:3px;font:11px/1 var(--f-display);padding:3px 5px;border-radius:4px;background:#5a5470;color:#fff}
.card.S .rar{background:linear-gradient(180deg,#f2d88e,#b9832a);color:#3a1f08}
.card.SP .rar{background:linear-gradient(180deg,#ffb27a,#c4321f);color:#fff}
.card .lv{position:absolute;top:3px;right:3px;font-size:10px;font-weight:700;background:rgba(0,0,0,.5);border-radius:4px;padding:1px 4px}
.card .stars{font-size:10px;color:var(--gold-hi);letter-spacing:-1px;height:12px;line-height:12px}
.card .nm{background:rgba(26,17,12,.82);font-size:11.5px;font-weight:600;padding:3px 2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.off{filter:grayscale(1) brightness(.55)}
.card.in-team::after{content:"ออกรบ";position:absolute;right:3px;bottom:24px;font-size:9px;font-weight:700;background:var(--good);color:#0e2a0d;border-radius:3px;padding:1px 4px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:380px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.wei{--c:linear-gradient(160deg,#4a7fb3,var(--wei) 55%,#1c3a5a)}
.shu{--c:linear-gradient(160deg,#5ea56c,var(--shu) 55%,#1f4a2a)}
.wu{--c:linear-gradient(160deg,#cf5a48,var(--wu) 55%,#5e1b12)}
.qun{--c:linear-gradient(160deg,#8d6cb8,var(--qun) 55%,#372553)}
.tok.wei,.tok.shu,.tok.wu,.tok.qun{background:var(--c)}

/* roster filters */
.search{display:flex;gap:8px;margin-bottom:8px}
.search input{flex:1;min-width:0;border-radius:8px;border:2px solid var(--gold);background:var(--parchment);color:var(--on-parch);padding:8px 10px;font:inherit}
.search select{border-radius:8px;border:2px solid var(--gold);background:var(--parchment);color:var(--on-parch);padding:6px;font:inherit;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600;border:1.5px solid rgba(212,164,70,.6);background:rgba(0,0,0,.25);display:flex;align-items:center;gap:5px}
.chip[aria-pressed="true"]{background:var(--gold);color:#3a1f08;border-color:var(--gold-hi)}
.chip .s{font:15px/1 var(--f-seal)}
.count{font-size:12px;color:var(--parchment-2);margin:-2px 0 8px}
.empty{padding:28px 10px;text-align:center;color:var(--parchment-2)}

/* summon */
.banner{position:relative;border-radius:12px;overflow:hidden;border:2px solid var(--gold);padding:18px 16px;min-height:170px;
  background:radial-gradient(circle at 80% 30%,rgba(255,170,90,.35),transparent 45%),linear-gradient(135deg,#2b1240,#5a1a2e 55%,#1a0f2e)}
.banner .big{position:absolute;right:-6px;bottom:-26px;font:170px/1 var(--f-seal);color:rgba(255,215,140,.16);pointer-events:none}
.banner h3{font:24px/1.25 var(--f-display);margin:0 0 6px;color:var(--gold-hi);max-width:15em}
.banner p{margin:0;font-size:13px;color:var(--parchment-2);max-width:24em;line-height:1.5}
.feat{display:flex;gap:6px;margin-top:12px}
.feat .tok{width:46px;height:46px;font-size:30px;border-color:#ffb27a}
.pullrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pullrow .btn{display:flex;flex-direction:column;align-items:center;gap:2px}
.pullrow .btn small{font-weight:600;font-size:12px;display:flex;gap:4px;align-items:center}
.rates{margin-top:12px;padding:10px 12px;font-size:12.5px;line-height:1.6}
.rates b{font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:rgba(58,36,22,.18);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#c4321f,#ffb27a)}

/* team */
.rowlabel{font-size:12px;color:var(--parchment-2);margin:10px 0 6px;letter-spacing:.04em}
.slots{display:grid;gap:8px}
.slots.front{grid-template-columns:repeat(3,minmax(0,96px));justify-content:center}
.slots.back{grid-template-columns:repeat(3,minmax(0,96px));justify-content:center}
.slot-empty{aspect-ratio:3/4;border-radius:8px;border:2px dashed rgba(212,164,70,.55);display:grid;place-items:center;color:var(--parchment-2);font-size:12px;text-align:center;padding:4px}
.bonus{margin-top:14px;padding:10px 12px;font-size:13px;line-height:1.55}
.cycle{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px;font-weight:600;flex-wrap:wrap}
.cycle span.f{padding:2px 8px;border-radius:5px;color:#fff}

/* tasks */
.task{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:10px 12px;margin-bottom:8px}
.task b{font-weight:600;font-size:14px}
.task .bar i{background:linear-gradient(90deg,var(--shu),#8fd18a)}
.task small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.task .btn{padding:6px 12px;font-size:13px;grid-row:span 2}
.task.done{opacity:.6}

/* sheet & modal */
.veil{position:fixed;inset:0;background:rgba(10,6,4,.72);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:460px;max-height:88%;overflow:auto;background:var(--parchment);color:var(--on-parch);border-radius:16px 16px 0 0;border-top:3px solid var(--gold);
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .head{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:start}
.sheet h2{font:24px/1.2 var(--f-display);margin:2px 0 4px}
.sheet .en{font-size:12px;color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:12px;font-weight:600;border-radius:5px;padding:2px 8px;color:#fff}
.tag.role{background:var(--on-parch)}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin:14px 0}
.stat b{font-size:13.5px}
.stat{background:var(--parchment-2);border-radius:8px;padding:6px 4px;text-align:center}
.stat span{display:block;font-size:11px;color:var(--muted)}
.stat b{font-variant-numeric:tabular-nums;font-size:15px}
.skill{border:1.5px solid var(--gold);border-radius:10px;padding:10px 12px;background:#f7edd4}
.skill b{font:16px var(--f-display);color:var(--wu)}
.skill p{margin:4px 0 0;font-size:13px;line-height:1.55}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.actions .wide{grid-column:1/-1}
.cost{display:flex;gap:10px;justify-content:center;font-size:12px;font-weight:600;margin-top:2px}
.cost .no{color:var(--bad)}

/* pull results */
.reveal{position:fixed;inset:0;z-index:30;background:radial-gradient(circle at 50% 40%,#5a1a2e,#120a1e 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.reveal .grid{width:100%;max-width:420px;grid-template-columns:repeat(5,minmax(0,1fr))}
.reveal .card{animation:flip .45s ease-out both}
.reveal .card .seal{font-size:clamp(26px,8vw,40px)}
.reveal .tagnew{position:absolute;bottom:22px;left:0;right:0;font-size:9px;font-weight:700;color:#fff;background:var(--bad)}
.reveal .tagdup{position:absolute;bottom:22px;left:0;right:0;font-size:9px;font-weight:700;color:#3a1f08;background:var(--gold-hi)}
@keyframes flip{from{transform:rotateY(90deg) scale(.8);opacity:0}to{transform:none;opacity:1}}

/* battle */
.battle{position:fixed;inset:0;z-index:25;display:flex;justify-content:center;background:#120b08}
.field{width:100%;max-width:460px;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#3a2a3e 0%,#5d4030 48%,#6d5434 52%,#4a3a26 100%);
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bhead .rnd{font:16px var(--f-display);color:var(--gold-hi)}
.side{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px}
.line{display:flex;justify-content:center;gap:8px}
.u{width:64px;position:relative;transition:transform .18s ease-out}
.u .tok{width:64px;height:64px;font-size:40px}
.u .hp,.u .rg{height:6px;border-radius:3px;background:rgba(0,0,0,.5);margin-top:3px;overflow:hidden}
.u .rg{height:4px}
.u .hp i{display:block;height:100%;background:var(--good);transition:width .25s}
.u.foe .hp i{background:var(--bad)}
.u .rg i{display:block;height:100%;background:var(--gold-hi);transition:width .25s}
.u .n{font-size:10.5px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u.dead{opacity:.25;filter:grayscale(1)}
.u.lunge-up{transform:translateY(-16px) scale(1.08)}
.u.lunge-down{transform:translateY(16px) scale(1.08)}
.u.hit .tok{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.num{position:absolute;left:50%;top:10px;transform:translateX(-50%);font:18px var(--f-display);color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000;animation:pop .9s ease-out forwards;pointer-events:none;white-space:nowrap;z-index:2}
.num.crit{color:#ffcf5a;font-size:22px}
.num.heal{color:#8dff8a}
@keyframes pop{0%{opacity:0;transform:translate(-50%,6px) scale(.7)}20%{opacity:1;transform:translate(-50%,-6px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-34px)}}
.vs{text-align:center;font:30px/1 var(--f-seal);color:rgba(242,216,142,.5)}
.skillcall{position:fixed;left:0;right:0;top:44%;text-align:center;font:clamp(26px,8vw,38px)/1.2 var(--f-display);color:var(--gold-hi);text-shadow:0 3px 0 #4b150f,0 0 18px rgba(0,0,0,.8);pointer-events:none;animation:call 1s ease-out forwards;z-index:27;padding:0 16px}
@keyframes call{0%{opacity:0;transform:scale(1.4)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.result{position:fixed;inset:0;z-index:28;display:grid;place-items:center;background:rgba(10,6,4,.7);padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.result .panel{padding:20px;text-align:center;width:100%;max-width:340px}
.result h2{font:34px/1.1 var(--f-display);margin:0 0 6px}
.result .win{color:var(--shu)}
.result .lose{color:var(--wu)}
.result .rw{display:flex;justify-content:center;gap:14px;margin:12px 0;font-weight:700;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.result .rw span{display:flex;align-items:center;gap:5px}
.result p{font-size:13px;line-height:1.55;margin:6px 0 14px}

/* awakened cards */
.card.aw{border-color:#ff5a44;box-shadow:0 0 0 1px #ffc08a,0 0 14px rgba(255,70,40,.65)}
.card.aw .stars{color:#ffd2c4;letter-spacing:1px}
.coin.t{background:radial-gradient(circle at 35% 35%,#ffe1d0,#e2553a 55%,#7a1a0c);border-radius:3px}

/* city hub */
.back{font-size:13px;font-weight:600;color:var(--gold-hi);padding:4px 0 8px}
.events{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:10px}
.evt{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;border-radius:10px;background:rgba(0,0,0,.28);border:1.5px solid rgba(212,164,70,.55);font-size:12px;font-weight:600;text-align:center}
.evt i{font:normal 26px/1 var(--f-seal);color:var(--gold-hi)}
.evt small{font-size:10.5px;font-weight:500;color:var(--parchment-2);font-variant-numeric:tabular-nums}
.evt .dot,.bld .dot{top:4px;right:6px}
.city{position:relative;aspect-ratio:5/6;max-width:100%;border-radius:12px;overflow:hidden;border:2px solid var(--gold);
  background:radial-gradient(ellipse 70% 25% at 30% 20%,rgba(255,255,255,.75),transparent 70%),linear-gradient(180deg,#6fa3cf 0%,#b9d6e6 55%,#dbe9ea 100%)}
.city svg{position:absolute;inset:0;width:100%;height:100%}
.bld{position:absolute;background:rgba(26,17,12,.8);color:var(--parchment);border:1px solid var(--gold);border-radius:6px;padding:4px 9px;font-size:13px;font-weight:600;white-space:nowrap}
.bld.b1{left:8%;top:14%}.bld.b2{right:8%;top:30%}.bld.b3{left:10%;top:52%}.bld.b4{right:10%;top:70%}
.goal{display:block;width:100%;text-align:left;margin-top:10px;padding:10px 12px;font-size:13px;font-weight:600}
.goal small{display:block;font-weight:500;color:var(--muted);margin-top:2px}

/* awakening shrine */
.shrine{border-radius:12px;border:2px solid var(--gold);padding:12px;background:radial-gradient(circle at 50% 45%,rgba(255,120,80,.25),transparent 55%),linear-gradient(180deg,#2a1838,#4a1a24)}
.sh-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.altar{position:relative;width:min(100%,300px);aspect-ratio:1;margin:4px auto 0}
.altar svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;left:var(--x);top:var(--y);width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;display:grid;place-items:center;font:22px/1 var(--f-seal);color:#9a9aa6;background:radial-gradient(circle at 40% 35%,#d8d8de,#6e6e7a);border:2px solid #4a4a54}
.node.on{color:#fff;background:radial-gradient(circle at 40% 35%,#ffb0e8,#a43fd0 60%,#4a1670);border-color:#ffb27a;box-shadow:0 0 12px rgba(255,150,90,.8)}
.pick{position:absolute;left:50%;top:50%;width:96px;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--gold-hi)}
.pick .card{width:96px}
.pick .plus{width:96px;aspect-ratio:3/4;border-radius:8px;border:2px dashed var(--gold);display:grid;place-items:center;font-size:40px;color:var(--gold-hi);background:rgba(0,0,0,.3)}
.pity{text-align:center;font:17px/1.4 var(--f-display);margin:8px 0 0;color:var(--parchment)}
.pity .red{color:#ff6a50}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:13px;flex-wrap:wrap}
.btn.small{padding:5px 10px;font-size:12.5px}
.loot-list{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:380px}
.loot-list span{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.4);border:1px solid var(--gold);border-radius:999px;padding:6px 12px;font-weight:600;font-variant-numeric:tabular-nums}
.loot-list span.hot{border-color:#ff6a50;color:#ffc0b0;box-shadow:0 0 10px rgba(255,90,60,.5)}

/* tower */
.tower{display:flex;flex-direction:column;align-items:center;gap:6px;margin:6px 0 12px}
.floor{width:min(100%,280px);border-radius:8px;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14px;background:rgba(0,0,0,.28);border:1.5px solid rgba(212,164,70,.4)}
.floor.cur{background:var(--parchment);color:var(--on-parch);border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,164,70,.35)}
.floor.done{opacity:.5}
.floor small{font-weight:500;font-size:12px}

/* bag & bonds */
.item{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:10px 12px;margin-bottom:8px}
.item .ic{width:56px;height:56px;border-radius:10px;display:grid;place-items:center;font:34px/1 var(--f-seal);color:#fff8e6;background:linear-gradient(160deg,#ffb27a,#c4321f);border:2px solid var(--gold)}
.item b{font-weight:600}
.item p{margin:2px 0 0;font-size:12px;color:var(--muted);line-height:1.45}
.bonds{margin-top:12px}
.bonds h4,.awk h4{font:15px var(--f-display);margin:0 0 6px;color:var(--on-parch)}
.bond{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:5px 8px;border-radius:6px;background:var(--parchment-2);margin-bottom:4px;opacity:.65}
.bond.on{opacity:1;background:#e9d38f;font-weight:600}
.bond em{font-style:normal;color:var(--shu);white-space:nowrap}
.awk{margin-top:12px;border:1.5px solid #e2553a;border-radius:10px;padding:10px 12px;background:#f8e3d4}
.awk p{margin:2px 0 8px;font-size:12.5px;line-height:1.5}
.selgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.selgrid .card[aria-pressed="true"]{outline:3px solid var(--good);outline-offset:1px}
.teambonds{margin-top:10px;padding:10px 12px;font-size:13px;line-height:1.55}

/* phase 3: gear, arena, beasts, fishing, shop, login */
.events{grid-template-columns:repeat(5,minmax(0,1fr))}
.evt i{font-size:22px}
.bld.b5{left:6%;top:76%}.bld.b6{right:6%;top:9%}
.gear{margin-top:12px}
.gear h4{font:15px var(--f-display);margin:0 0 6px}
.gslots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.gslot{border-radius:8px;border:2px solid var(--q,#b9a57a);background:#f7edd4;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--on-parch)}
.gslot i{font:normal 26px/1 var(--f-seal);color:var(--q,#b9a57a)}
.gslot i.e{opacity:.35}
.gslot small{font-size:10px;font-weight:700}
.gslot span{font-size:11px}
.glist{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.grow{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:7px 9px;border-radius:8px;background:#f7edd4;border-left:4px solid var(--q)}
.grow .gi{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;font:24px/1 var(--f-seal);color:#fff;background:var(--q)}
.grow b{font-size:13px;font-weight:600;color:var(--on-parch)}
.grow p{margin:1px 0 0;font-size:11.5px;color:var(--muted);line-height:1.4}
.grow .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
main .grow{background:var(--parchment)}
.opp{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 12px;margin-bottom:8px}
.opp b{font-weight:600}
.opp .foes{justify-content:flex-start;margin-top:4px}
.arena-top{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;text-align:center}
.arena-top div{background:rgba(0,0,0,.28);border:1.5px solid rgba(212,164,70,.5);border-radius:10px;padding:8px 4px}
.arena-top b{display:block;font:20px var(--f-display);color:var(--gold-hi);font-variant-numeric:tabular-nums}
.arena-top span{font-size:11.5px;color:var(--parchment-2)}
.beast .ic{background:linear-gradient(160deg,#5fc2b0,#1d6a70)}
.beast.tiger .ic{background:linear-gradient(160deg,#e9e6dc,#8a8578);color:#2a2620}
.beast.phoenix .ic{background:linear-gradient(160deg,#ff9a6a,#b0281a)}
.beast.tortoise .ic{background:linear-gradient(160deg,#6b6f8a,#22243a)}
.beast.locked .ic{filter:grayscale(1) brightness(.7)}
.pond{position:relative;border-radius:12px;border:2px solid var(--gold);overflow:hidden;aspect-ratio:16/10;max-width:100%;
  background:radial-gradient(ellipse 40% 12% at 50% 62%,rgba(255,255,255,.35),transparent 70%),linear-gradient(180deg,#9fd0c8 0%,#4d9aa3 40%,#23606e 100%)}
.pond .line{position:absolute;left:50%;top:0;height:58%;border-left:1.5px solid rgba(255,255,255,.8)}
.pond .bob{position:absolute;left:calc(50% - 7px);top:56%;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#e2553a 60%);animation:bob 1.4s ease-in-out infinite}
.pond .msg{position:absolute;left:0;right:0;bottom:10px;text-align:center;font:18px var(--f-display);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.4);padding:0 12px}
.fishbar{position:relative;height:26px;border-radius:13px;background:rgba(0,0,0,.4);border:2px solid var(--gold);margin:12px 0 10px;overflow:hidden}
.fishbar .zone{position:absolute;top:0;bottom:0;background:rgba(90,169,87,.75)}
.fishbar .zone::after{content:"";position:absolute;left:35%;right:35%;top:0;bottom:0;background:rgba(242,216,142,.85)}
.fishbar .mark{position:absolute;top:-2px;bottom:-2px;width:5px;margin-left:-2px;background:#fff;box-shadow:0 0 6px #fff}
.days{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.day{border-radius:10px;padding:10px 6px;text-align:center;background:var(--parchment);color:var(--on-parch);border:2px solid var(--parchment-2);display:flex;flex-direction:column;gap:4px;align-items:center;font-size:12px}
.day b{font:15px var(--f-display)}
.day.ready{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,164,70,.4)}
.day.got{opacity:.5}
.day.big{grid-column:span 2;background:linear-gradient(160deg,#ffe0b0,#f0c27a)}
.day .btn{padding:4px 10px;font-size:12px}

/* phase 4: portraits, skills, guild */
.card .seal{position:relative;overflow:hidden}
.card .seal svg{position:absolute;inset:4px 0 0;width:100%;height:calc(100% - 4px)}
.card .seal em{position:absolute;left:3px;bottom:3px;font:normal 14px/1 var(--f-seal);color:#fff8e6;background:rgba(122,26,12,.88);border-radius:3px;padding:2px 3px}
.tok{overflow:hidden}
.tok svg{width:100%;height:100%;display:block}
.events{grid-template-columns:repeat(4,minmax(0,1fr))}
.bld.b7{left:50%;top:2%;transform:translateX(-50%)}
.sk5{display:flex;flex-direction:column}
.sk{display:grid;grid-template-columns:76px 1fr;gap:8px;padding:6px 0;border-bottom:1px dashed rgba(58,36,22,.25)}
.sk:last-child{border-bottom:0}
.sk span{font:13px/1.3 var(--f-display);color:var(--wu)}
.sk p{margin:0;font-size:12.5px;line-height:1.5}
.sk.lock{opacity:.5}
.lvbtns{display:flex;gap:4px}
.lvbtns .btn{flex:1;padding:10px 6px}

/* phase 5: online */
.chatlog{height:min(48vh,380px);overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.msg{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;font-size:13px;line-height:1.45;align-items:baseline}
.msg b{font-weight:600;color:var(--wei);white-space:nowrap;max-width:9em;overflow:hidden;text-overflow:ellipsis}
.msg.mine b{color:var(--wu)}
.msg span{min-width:0;overflow-wrap:anywhere}
.msg small{font-size:10.5px;color:var(--muted)}
.chatform{display:flex;gap:8px;margin-top:8px}
.chatform input{flex:1;min-width:0;border-radius:8px;border:2px solid var(--gold);background:var(--parchment);color:var(--on-parch);padding:8px 10px;font:inherit}
.chip[disabled]{opacity:.5}

/* phase 6: art pass */
.card .seal svg{inset:2px 0 0;height:calc(100% - 2px)}
.mechtag{position:absolute;right:3px;top:22px;font-size:9px;font-weight:700;color:#06333d;background:#5ff0ff;border-radius:3px;padding:1px 4px;box-shadow:0 0 8px #5ff0ff}
.card.aw .seal{background:radial-gradient(circle at 50% 45%,rgba(255,120,80,.45),transparent 65%)}
.card.SP .seal{background:radial-gradient(circle at 50% 40%,rgba(255,215,140,.4),transparent 62%)}
.mechbox{border-color:#2ad8ff;background:linear-gradient(160deg,#e8fbff,#d6eef6)}
.mechprev{display:flex;align-items:center;justify-content:center;gap:10px;margin:4px 0 8px;font-size:22px;color:#2a8aa8}
.mechprev .tok{width:64px;height:64px}
.scene .march{bottom:9%;left:6%;right:auto;justify-content:flex-start;gap:0}
.scene .march .tok{width:56px;height:56px;margin-right:-10px;background:none;border:0;box-shadow:none;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
.scene .foe-march{left:auto;right:6%;bottom:16%;justify-content:flex-end}
.scene .foe-march .tok{width:44px;height:44px;filter:grayscale(.4) brightness(.75) drop-shadow(0 3px 2px rgba(0,0,0,.35));animation-direction:reverse}
.clash{position:absolute;left:58%;bottom:22%;width:34px;height:34px;margin-left:-17px;border-radius:50%;background:radial-gradient(circle,#fff 0 20%,#ffd56a 35%,transparent 70%);animation:clash 2.2s ease-out infinite;pointer-events:none}
@keyframes clash{0%,60%{opacity:0;transform:scale(.3)}70%{opacity:1;transform:scale(1.3)}100%{opacity:0;transform:scale(1.8)}}
.city{background:linear-gradient(180deg,#7fb6e0 0%,#bfdcef 55%,#e6f1f2 100%)}
.bld{box-shadow:0 2px 0 rgba(0,0,0,.35);border-radius:4px 10px 4px 10px;background:linear-gradient(180deg,rgba(74,20,15,.92),rgba(26,17,12,.92))}
.field{position:relative;overflow:hidden;background:#2a1a12}
.bfbg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.field>*:not(.bfbg){position:relative;z-index:1}
.field.shake{animation:fshake .4s}
@keyframes fshake{20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,2px)}80%{transform:translate(3px,-1px)}}
.u{width:76px}
.u .tok{width:76px;height:76px;background:none!important;border:0;box-shadow:none;overflow:visible;filter:drop-shadow(0 4px 3px rgba(0,0,0,.45))}
.u::before{content:"";position:absolute;left:10px;right:10px;top:62px;height:14px;border-radius:50%;background:radial-gradient(rgba(0,0,0,.5),transparent 70%)}
.u .n{color:#fff6dc;text-shadow:0 1px 2px #000}
.u.foe .tok{filter:drop-shadow(0 4px 3px rgba(0,0,0,.45)) saturate(.85)}
.fx{position:absolute;left:50%;top:32px;pointer-events:none;z-index:3}
.fx.slash{width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;border-top:5px solid #fff;border-right:3px solid rgba(255,255,255,.6);animation:slash .35s ease-out forwards}
.fx.slash.big{width:100px;height:100px;margin:-50px 0 0 -50px;border-top-color:#ffd56a;border-top-width:8px}
@keyframes slash{from{transform:rotate(-60deg) scale(.6);opacity:1}to{transform:rotate(80deg) scale(1.1);opacity:0}}
.fx.pierce,.fx.spark{width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:radial-gradient(circle,#fff,#ffd56a 40%,transparent 70%);animation:pop2 .35s ease-out forwards}
.fx.burst{width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:radial-gradient(circle,#fff6c0 0 15%,#ff9a3a 35%,#d9301a 55%,transparent 72%);animation:pop2 .55s ease-out forwards}
.fx.healfx{width:80px;height:80px;margin:-40px 0 0 -40px;border-radius:50%;background:radial-gradient(circle,rgba(150,255,150,.8),rgba(60,200,90,.3) 50%,transparent 70%);animation:pop2 .6s ease-out forwards}
.fx.divine{width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:4px solid #ffd56a;box-shadow:0 0 24px #ffd56a,inset 0 0 24px #ffd56a;animation:pop2 .7s ease-out forwards}
@keyframes pop2{from{transform:scale(.3);opacity:1}to{transform:scale(1.2);opacity:0}}
.proj{position:absolute;left:0;top:0;pointer-events:none;z-index:4}
.proj.arrow{width:34px;height:3px;margin:-1.5px 0 0 -17px;background:linear-gradient(90deg,transparent,#e8dcc0 30%,#fff);border-radius:2px}
.proj.orb{width:16px;height:16px;margin:-8px;border-radius:50%;background:radial-gradient(circle,#fff,#7ad8ff 50%,transparent 72%);box-shadow:0 0 12px #7ad8ff}
.proj.fireball{width:30px;height:30px;margin:-15px;border-radius:50%;background:radial-gradient(circle,#fff6c0,#ff8a2a 45%,#c4321f 65%,transparent 75%);box-shadow:0 0 20px #ff6a2a}
.skillcall{display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(90deg,transparent,rgba(74,20,15,.9) 20%,rgba(74,20,15,.9) 80%,transparent);padding:10px 16px}
.skillcall .cut{width:84px;height:84px;flex:none;border-radius:50%;border:3px solid var(--gold-hi);background:var(--c)}
.skillcall.theirs{background:linear-gradient(90deg,transparent,rgba(20,20,40,.9) 20%,rgba(20,20,40,.9) 80%,transparent)}
.skillcall b{font-weight:400}
.reveal .card .seal{font-size:inherit}

/* phase 7: sound, story, events */
.sndbtn{width:34px;height:34px;flex:none;border-radius:50%;border:1.5px solid var(--gold);font:18px/1 var(--f-seal);color:var(--gold-hi);background:rgba(0,0,0,.3)}
.sndbtn.off{opacity:.45;text-decoration:line-through}
.bld.b8{left:34%;top:88%}
.evbanner{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;margin-top:10px;padding:10px 12px}
.evbanner .ic{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font:26px/1 var(--f-seal);color:#fff8e6;background:linear-gradient(160deg,#ffb27a,#c4321f);border:2px solid var(--gold)}
.evbanner b{font-weight:600;font-size:13.5px}.evbanner p{margin:2px 0 0;font-size:12px;color:var(--muted);line-height:1.45}
.evbanner .tok{width:46px;height:46px}
.chapter{padding:10px 12px;margin-bottom:10px}
.chhead{display:flex;gap:10px;align-items:center}
.chno{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font:18px var(--f-display);color:#fff4dc;background:var(--wu);border:2px solid var(--gold)}
.chhead b{font:16px var(--f-display)}.chhead p{margin:1px 0 0;font-size:12px;color:var(--muted)}
.chstages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.stg{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:10px;background:var(--parchment-2);border:2px solid var(--gold);color:var(--on-parch)}
.stg .tok{width:46px;height:46px}
.stg span{font:14px var(--f-display)}.stg small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.stg.clear{background:#e3efd6;border-color:var(--shu)}
.stg[disabled]{opacity:.45;filter:grayscale(.8)}
.dlg{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:flex-end;background:#1a110c;cursor:pointer;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlgscene{position:absolute;inset:0;opacity:.85}.dlgscene svg{width:100%;height:100%}
.dlgtitle{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font:16px var(--f-display);color:#fff6dc;text-shadow:0 2px 3px #000;padding:0 16px}
.speaker{position:relative;z-index:1;display:flex;margin:0 auto;width:100%;max-width:460px}
.speaker.r{justify-content:flex-end}
.speaker .tok{width:min(58vw,240px);height:min(58vw,240px);background:none!important;border:0;box-shadow:none;filter:drop-shadow(0 6px 6px rgba(0,0,0,.5));animation:spk .3s ease-out}
@keyframes spk{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.dlgbox{position:relative;z-index:1;width:100%;max-width:460px;margin:-18px auto 0;background:var(--parchment);color:var(--on-parch);border:2px solid var(--gold);border-radius:12px;padding:12px 14px}
.dlgbox b{font:17px var(--f-display);color:var(--wu)}
.dlgbox p{margin:6px 0 10px;font-size:15px;line-height:1.6}
.dlgbtns{display:flex;justify-content:flex-end;gap:8px}
.dlgbox,.speaker{box-sizing:border-box}

/* painted art */
img.art{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 18%;pointer-events:none;user-select:none}
.card .seal img.art{position:absolute;inset:0;transform:scale(1.15);transform-origin:50% 30%}
.u .tok img.art,.speaker .tok img.art,.mechprev .tok img.art{object-fit:contain;object-position:50% 100%}
.scene .march .tok img.art{object-fit:contain;object-position:50% 100%}
.speaker .tok{width:min(70vw,300px);height:min(70vw,300px)}

/* phase 8: opening, shards */
.tut-hl{position:relative;z-index:5;animation:tutpulse 1.2s ease-in-out infinite;outline:3px solid #ffe066;outline-offset:2px;border-radius:10px}
@keyframes tutpulse{50%{outline-color:transparent;box-shadow:0 0 18px #ffe066}}
.tutor{position:absolute;left:8px;right:8px;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:15;display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:start;

  const h=HERO[id], r=ROLE[h.role], q=RAR[h.rar];
  const m = q.m*(1+(lv-1)*0.09)*(1+(star-1)*0.18)*(1+aw*0.25);
  return {hp:Math.round(1000*r.hp*m), atk:Math.round(100*r.atk*m), def:Math.round(50*r.def*m), mdef:Math.round(50*r.mdef*m), spd:r.spd+q.spd};
}

function power(id, lv, star, aw=0){const s=stats(id,lv,star,aw);return Math.round(s.hp*0.25+s.atk*3+s.def*2)}

const activeBonds = ids => BONDS.filter(b=>b.ids.every(i=>ids.includes(i)));
function bondBonus(ids, id){let hp=0,atk=0; for(const b of activeBonds(ids)) if(b.ids.includes(id)){hp+=b.hp;atk+=b.atk} return {hp,atk}}

function pickTeam(rnd, pool){
  const ids=[];
  while(ids.length<5){const id=pool[Math.floor(rnd()*pool.length)]; if(!ids.includes(id)) ids.push(id)}
  // tanky roles to the front row
  ids.sort((a,b)=>{const o={war:0,cav:1,heal:3,strat:2,arch:2};return o[HERO[a].role]-o[HERO[b].role]});
  return ids;
}
// The first stages are a gentle opening: few, weakened enemies so a lone young Liu Bei can win.
const OPENING = {1:{n:2, weak:.75}, 2:{n:3, weak:.45}, 3:{n:4, weak:.3}};
function enemyTeam(stage){
  const rnd = mulberry32(stage*7919+17), op=OPENING[stage];
  if(op){
    const ids=pickTeam(rnd, HEROES.filter(h=>h.rar==='A' && h.fac!=='shu').map(h=>h.id)).slice(0,op.n);
    return ids.map(id=>({id, lv:1, star:1, aw:0, bonus:{hpPct:-op.weak, atkPct:-op.weak}}));
  }
  const ids = pickTeam(rnd, HEROES.filter(h => h.rar==='A' || (h.rar==='S' && stage>=8) || (h.rar==='SP' && stage>=20)).map(h=>h.id));
  const star = Math.min(5, 1+Math.floor((stage-1)/20));
  const lv = Math.min(levelCap(star), stage);
  return ids.map(id=>({id, lv, star, aw:0}));
}
// Trial tower (หอท้าขุนพล): its own ladder, harder and with awakened enemies from floor 60.
function towerTeam(floor){
  const rnd = mulberry32(floor*104729+3);
  const ids = pickTeam(rnd, HEROES.filter(h => h.rar!=='SP' || floor>=12).map(h=>h.id));
  const star = Math.min(5, 1+Math.floor(floor/12));
  const aw = Math.max(0, Math.min(5, Math.floor((floor-50)/10)));
  const lv = Math.min(levelCap(star,aw), 1+Math.floor(floor*1.5));
  return ids.map(id=>({id, lv, star, aw}));
}

// Gear (อุปกรณ์): flat stats scaled by item level (il), quality and enhancement.
const SLOTS = [{k:'wpn',th:'อาวุธ',ch:'兵'},{k:'arm',th:'เกราะ',ch:'甲'},{k:'hlm',th:'หมวก',ch:'盔'},{k:'mnt',th:'ม้าศึก',ch:'马'}];
const QUAL = [{th:'ธรรมดา',c:'#8f8f8f',m:1},{th:'ดี',c:'#4f9a4a',m:1.5},{th:'หายาก',c:'#3c78c0',m:2.2},{th:'มหากาพย์',c:'#8a4fc4',m:3.2},{th:'ตำนาน',c:'#e0682a',m:4.6}];
const GEAR_MAX_ENH = 10;
function gearStats(g){
  const b = g.il*QUAL[g.q].m*0.4*(1+g.enh*0.12);
  if(g.slot==='wpn') return {atk:Math.round(b*4)};
  if(g.slot==='arm') return {def:Math.round(b*2), hp:Math.round(b*10)};
  if(g.slot==='hlm') return {hp:Math.round(b*25)};
  return {spd:Math.min(30, 2+g.q*3+g.enh), atk:Math.round(b*1.5)};
}
const gearScore = g => { const s=gearStats(g); return Math.round((s.hp||0)*0.25+(s.atk||0)*3+(s.def||0)*2+(s.spd||0)*20) };
const enhCost = g => Math.round(500*(g.enh+1)*(g.q+1)*(1+g.il/40));

// Divine beasts (สัตว์เทพ): team-wide percentage bonuses, fed with fish.
const BEASTS = [
  {k:'dragon',  th:'มังกรเขียว', ch:'龙', atk:.006, hp:0,    def:0},

function beastPct(levels){ const p={hp:0,atk:0,def:0}; for(const b of BEASTS){const lv=levels[b.k]||0; p.hp+=b.hp*lv; p.atk+=b.atk*lv; p.def+=b.def*lv} return p }

// x = {id, lv, star, aw, bonus?:{hp,atk,def,spd,hpPct,atkPct,defPct}}, bb = bond bonus
function finalStats(x, bb={hp:0,atk:0}){
  const s=stats(x.id,x.lv,x.star,x.aw||0), b=x.bonus||{};
  return {hp:Math.round((s.hp+(b.hp||0))*(1+bb.hp+(b.hpPct||0))), atk:Math.round((s.atk+(b.atk||0))*(1+bb.atk+(b.atkPct||0))),
          def:Math.round((s.def+(b.def||0))*(1+(b.defPct||0))), mdef:Math.round((s.mdef+(b.def||0)*0.5)*(1+(b.defPct||0))), spd:s.spd+(b.spd||0)};
}
const powerOf = f => Math.round(f.hp*0.25+f.atk*3+f.def*1.2+(f.mdef||0)*1.2+(f.spd-100)*20);

function botTeam(bot, myPts, avgLv, ref){

  const star=Math.min(5, Math.max(1, Math.ceil(lv/20))); lv=Math.min(lv, levelCap(star));
  return ids.map(id=>({id, lv, star, aw:0}));
}

// Deterministic auto-battle. A and B are 5-slot arrays (slots 0-1 front row, 2-4 back row), null = empty.
function simulate(A, B, seed){
  const rnd = mulberry32(seed);
  const units = [];
  const mk = (side, arr) => { const ids=arr.filter(Boolean).map(x=>x.id);
    arr.forEach((x,i)=>{ if(!x) return; const aw=x.aw||0, f=finalStats(x, bondBonus(ids,x.id));
      const role=HERO[x.id].role;
      units.push({uid:side+i, side, slot:i, id:x.id, fac:HERO[x.id].fac, role, lv:x.lv, star:x.star, aw, hp:f.hp, max:f.hp, atk:Math.round(f.atk*(role==='arch'?1.1:1)), def:f.def, mdef:f.mdef, spd:f.spd, rage:0, alive:true, div:false}); }); };
  mk('p',A); mk('e',B);
  const start = units.map(u=>({...u}));
  const actions = [];
  const alive = side => units.filter(u=>u.alive && u.side===side);
  const pick = arr => arr[Math.floor(rnd()*arr.length)];
  const front = foes => { const f=foes.filter(u=>u.slot<3); return f.length?f:foes };
  const back  = foes => { const b=foes.filter(u=>u.slot>=3); return b.length?b:foes };
  let round = 0, winner = null;
  for(round=1; round<=20 && !winner; round++){
    const order = units.filter(u=>u.alive).sort((a,b)=>b.spd-a.spd || (a.uid<b.uid?-1:1));
    for(const u of order){
      if(!u.alive) continue;
      const foes = alive(u.side==='p'?'e':'p');
      if(!foes.length) break;
      const allies = alive(u.side);
      const isSkill = u.rage>=100;
      const kind = isSkill ? ROLE[u.role].kind : 'normal';
      const m = isSkill ? skillMult(u.id,u.aw)*(u.role==='strat'?1.2:1) : 1;
      const hits = [];
      const strike = (t, mult, combo=false) => {
        const adv = BEATS[u.fac]===t.fac ? 1.25 : BEATS[t.fac]===u.fac ? 0.85 : 1;
        const crit = rnd() < (u.role==='cav' ? 0.25 : 0.12);
        const dmg = Math.max(1, Math.round(u.atk*mult*(120/(120+(ROLE[u.role].mag?t.mdef:t.def)))*adv*(crit?1.6:1)*(0.92+rnd()*0.16)*(t.role==='war'?0.85:1)));
        t.hp = Math.max(0, t.hp-dmg);
        if(t.hp===0) t.alive=false; else t.rage=Math.min(100,t.rage+10);
        hits.push({tgt:t.uid, dmg, crit, adv, combo, hp:t.hp, dead:!t.alive});
        // divine base (ฐานเทวะ): an awakened general rises once when nearly fallen
        if(t.alive && t.aw>0 && !t.div && t.hp < t.max*0.3){
          t.div=true; const amt=Math.round(t.max*(0.2+t.aw*0.04));
          t.hp=Math.min(t.max,t.hp+amt); t.atk=Math.round(t.atk*(1+t.aw*0.05));
          hits.push({tgt:t.uid, heal:amt, divine:true, hp:t.hp});
        }
      };
      const heal = (t, amt) => { t.hp=Math.min(t.max,t.hp+amt); hits.push({tgt:t.uid, heal:amt, hp:t.hp}) };
      if(kind==='heal'){
        for(const t of allies) heal(t, Math.round(u.atk*m*(0.95+rnd()*0.1)));
      } else {
        const targets = kind==='aoe' ? foes : kind==='back' ? [pick(back(foes))] : kind==='single' ? [pick(front(foes))] : [u.role==='arch' ? pick(foes) : pick(front(foes))];
        for(const t of targets) strike(t, m);
        if(kind==='normal'){
          if(targets[0].alive && rnd() < comboChance(u.role)) strike(targets[0], 0.6, true);
          if(u.role==='heal'){ const a=alive(u.side).sort((x,y)=>x.hp/x.max-y.hp/y.max)[0]; if(a) heal(a, Math.round(u.atk*0.5)) }
        }
      }
      u.rage = isSkill ? 0 : Math.min(100, u.rage+34);
      actions.push({round, src:u.uid, skill:isSkill?HERO[u.id].sk:null, hits, rage:Object.fromEntries(units.map(x=>[x.uid,x.rage]))});
      if(!alive('e').length){winner='p';break}
      if(!alive('p').length){winner='e';break}
    }
  }
  return {start, actions, winner: winner || 'e', rounds: Math.min(round,20)};
}

function migrate(d){
  const f=freshState();
  for(const k of ['tickets','souls','tower','shrinePick','shrinePity','gear','gearSeq','beasts','fishPts','fishing','arena','login','guild','story','potions','friend']) if(d[k]===undefined) d[k]=f[k];

  if(d.tut===undefined) d.tut=99;          // saves from before the tutorial skip it
  if(!d.shards) d.shards={};
  if(d.team.length===5) d.team=[d.team[0],d.team[1],null,d.team[2],d.team[3],d.team[4]]; // old 2+3 layout → 3+3
  for(const h of Object.values(d.heroes)){ if(h.aw===undefined) h.aw=0; if(!h.eq) h.eq={} }
  return d;
}

const hashN = s => { let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))>>>0; return h };
// Mecha form (ร่างจักรกล): unlocked at awakening 3, a steel-and-light redesign of the same general.
const isMech = id => !!(typeof S!=='undefined' && S && S.heroes[id] && S.heroes[id].mech && S.heroes[id].aw>=3);
const PDEFS = `<defs><radialGradient id="pg-aura"><stop offset="0" stop-color="#fff6d8" stop-opacity=".55"/><stop offset="1" stop-color="#fff6d8" stop-opacity="0"/></radialGradient>

  const blade=mech?'#bff8ff':'#dfe5ea';
  let g=PDEFS+`<ellipse cx="50" cy="58" rx="46" ry="42" fill="url(#${mech?'pg-mech':'pg-aura'})"/>`;
  // weapon behind the body
  const W={
    war:`<path d="M88 100 L72 8" stroke="#5a3a1a" stroke-width="3.2"/><path d="M72 8 Q58 14 62 34 L74 24Z" fill="${blade}" stroke="#5a5f66"/><circle cx="73" cy="26" r="2.4" fill="#c4321f"/>`,
    cav:`<path d="M90 100 L76 4" stroke="#5a3a1a" stroke-width="3"/><path d="M76 4 L71 18 L76 24 L81 17Z" fill="${blade}" stroke="#5a5f66"/><path d="M76 24 Q70 30 72 36 M76 24 Q82 30 80 36" stroke="#c4321f" stroke-width="2" fill="none"/>`,
    arch:`<path d="M86 14 Q62 52 86 94" fill="none" stroke="#7a4a1a" stroke-width="3.4"/><path d="M86 14 L86 94" stroke="#efe6d0" stroke-width=".9"/>`,

    heal:`<path d="M86 100 L80 20" stroke="#6a4a22" stroke-width="3"/><circle cx="80" cy="22" r="6" fill="#c9a24a"/><circle cx="80" cy="12" r="4" fill="#c9a24a"/><path d="M80 22 Q90 26 88 34" stroke="#c4321f" stroke-width="1.6" fill="none"/>`
  };
  g+=W[h.role];
  if(mech) g+=`<path d="M8 70 L20 54 L26 74Z M92 70 L80 54 L74 74Z" fill="#7d8fa6" stroke="#5ff0ff" stroke-width="1"/>`;
  // body
  g+=`<path d="M12 100 Q13 75 34 69 L66 69 Q87 75 88 100Z" fill="${armor}"/>`;
  g+=`<path d="M40 69 L50 83 L60 69Z" fill="${mech?'#1d2633':'#f3ead6'}"/><path d="M37 69 L50 86 L63 69" fill="none" stroke="${trim}" stroke-width="2.6"/>`;
  g+=`<path d="M11 86 Q15 67 34 68 Q31 80 22 90Z" fill="${armor2}" stroke="${trim}" stroke-width="1.6"/><path d="M89 86 Q85 67 66 68 Q69 80 78 90Z" fill="${armor2}" stroke="${trim}" stroke-width="1.6"/>`;
  g+=`<rect x="30" y="94" width="40" height="6" fill="${armor2}"/><circle cx="50" cy="96.5" r="3.2" fill="${trim}"/>`;
  if(mech) g+=`<circle cx="50" cy="89" r="4" fill="#5ff0ff"/><circle cx="50" cy="89" r="7" fill="none" stroke="#5ff0ff" stroke-width="1" opacity=".6"/><path d="M24 80 L34 80 M66 80 L76 80" stroke="#5ff0ff" stroke-width="1.4"/>`;

  // front hair

       `M25 45 Q24 15 50 15 Q76 15 75 45 Q70 27 44 27 Q34 29 25 45Z`,
       `M25 45 L22 29 L30 31 L30 19 L40 25 L46 13 L54 23 L62 15 L66 27 L76 25 L75 45 Q66 29 50 29 Q34 29 25 45Z`][hv%3];
  g+=`<path d="${HF}" fill="${hair}"/>`;

  // eyes
  const ey=f?6.6:5.8;
  for(const cx of [39,61]){
    g+=`<ellipse cx="${cx}" cy="48" rx="4.4" ry="${ey}" fill="#24160e"/><ellipse cx="${cx}" cy="49.6" rx="3.1" ry="${(ey-2).toFixed(1)}" fill="${iris}"/>`;
    g+=`<circle cx="${cx+1.5}" cy="45.4" r="1.7" fill="#fff"/><circle cx="${cx-1.3}" cy="51.6" r=".85" fill="#fff"/>`;
    g+=`<path d="M${cx-5.2} ${(49-ey).toFixed(1)} Q${cx} ${(46.4-ey).toFixed(1)} ${cx+5.2} ${(49-ey).toFixed(1)}" stroke="#1a100a" stroke-width="1.9" fill="none" stroke-linecap="round"/>`;
  }
  if(f) g+=`<path d="M33.6 42.6 L31.4 41 M66.4 42.6 L68.6 41" stroke="#1a100a" stroke-width="1.4" stroke-linecap="round"/>`;
  else {
    const stern=h.role==='war'||h.role==='cav'; const bcol=L.old?'#a8a29a':hair;
    g+= stern ? `<path d="M32 37 L45 40 M68 37 L55 40" stroke="${bcol}" stroke-width="3" stroke-linecap="round"/>`

  }
  g+=`<ellipse cx="32" cy="56" rx="4.2" ry="2.2" fill="#f08a8a" opacity="${f?.55:.3}"/><ellipse cx="68" cy="56" rx="4.2" ry="2.2" fill="#f08a8a" opacity="${f?.55:.3}"/>`;
  if(L.patch) g+=`<ellipse cx="39" cy="48" rx="7" ry="6.4" fill="#141010"/><path d="M24 40 L74 56" stroke="#141010" stroke-width="1.8"/>`;
  if(mech) g+=`<path d="M31 55 L35 55 M65 55 L69 55" stroke="#5ff0ff" stroke-width="1.6"/>`;
  g+=`<path d="M49 54.4 Q50 55.8 51 54.4" stroke="${skinS}" stroke-width="1.4" fill="none"/>`;
  g+=`<path d="M46 59.5 Q50 62.5 54 59.5" stroke="#8a3a2a" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
  // beards
  const BD={long:`<path d="M32 55 Q34 92 50 99 Q66 92 68 55 Q60 65 50 65 Q40 65 32 55Z"/>`,
            short:`<path d="M32 55 Q36 74 50 76 Q64 74 68 55 Q60 65 50 65 Q40 65 32 55Z"/>`,
            wild:`<path d="M29 52 L33 66 L28 73 L37 75 L35 84 L43 79 L50 88 L57 79 L65 84 L63 75 L72 73 L67 66 L71 52 Q60 66 50 66 Q40 66 29 52Z"/>`,
            goatee:`<path d="M45.5 63 Q50 79 54.5 63Z"/>`};
  if(L.beard) g+=`<g fill="${bc}">${BD[L.beard]}</g><path d="M41 58.5 Q50 54.5 59 58.5" stroke="${bc}" stroke-width="2.8" fill="none" stroke-linecap="round"/>`;
  // headgear: always above the brows so the face stays visible
  const helm=(fill,stroke)=>`<path d="M22 34 Q23 6 50 5 Q77 6 78 34 Q65 25 50 25 Q35 25 22 34Z" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/><path d="M27 31 Q50 21 73 31" stroke="${mech?'#5ff0ff':'#8a2a1a'}" stroke-width="2.6" fill="none"/>`;
  if(mech){
    g+=helm('url(#pg-steel)','#3a4658')+`<path d="M34 22 L50 13 L66 22" stroke="#5ff0ff" stroke-width="2.2" fill="none"/><path d="M50 6 L45 -2 L55 -2Z M24 26 L14 12 L28 20Z M76 26 L86 12 L72 20Z" fill="#5ff0ff"/>`;
  } else if(f){
    g+=`<path d="M35 21 Q50 10 65 21" fill="none" stroke="url(#pg-gold)" stroke-width="3.2"/><circle cx="50" cy="14" r="3.6" fill="#d9573f"/><path d="M64 20 L72 14 M64 20 L74 22" stroke="#e8c45a" stroke-width="1.6"/>`;
    if(h.role==='war'||h.role==='cav') g+=`<path d="M58 13 Q74 -3 94 7" stroke="#c4321f" stroke-width="3" fill="none"/>`;
  } else if(h.role==='war'){ g+=helm('url(#pg-gold)','#6b4a10')+`<path d="M50 -1 L44 10 L56 10Z" fill="#c4321f"/>` }
  else if(h.role==='cav'){ g+=helm('url(#pg-gold)','#6b4a10')+(L.pheasant?`<path d="M42 10 Q22 -12 2 4 M58 10 Q78 -12 98 4" stroke="#b02a1a" stroke-width="3.6" fill="none" stroke-linecap="round"/>`:`<path d="M56 9 Q74 -6 95 6" stroke="#c4321f" stroke-width="3.2" fill="none" stroke-linecap="round"/>`) }
  else if(h.role==='arch'){ g+=`<path d="M24 31 Q50 23 76 31 L76 35.5 Q50 27.5 24 35.5Z" fill="#c4321f"/><path d="M75 33 Q88 38 85 52" stroke="#c4321f" stroke-width="3" fill="none" stroke-linecap="round"/>` }
  else if(h.role==='strat'){ g+=`<rect x="39" y="3" width="22" height="15" rx="2.5" fill="#1c1c22"/><rect x="33" y="16" width="34" height="4.4" rx="2" fill="#1c1c22"/><circle cx="50" cy="10" r="2.4" fill="#3fbf8f"/>` }
  else { g+=`<path d="M26 31 Q29 7 50 7 Q71 7 74 31 Q62 23 50 23 Q38 23 26 31Z" fill="#ece3cc" stroke="#b9ae92"/><path d="M47 12 Q50 6 53 12 Q50 17 47 12Z" fill="#3b7b4a"/>` }
  return PCACHE[key]=`<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMax meet" aria-hidden="true">${g}</svg>`;
}

function cardHTML(id, opts={}){
  const h=HERO[id], own=S.heroes[id];
  const lv = opts.lv ?? own?.lv, st = opts.star ?? own?.star ?? 1, aw = opts.aw ?? own?.aw ?? 0;
  const cls = ['card',h.fac,h.rar, aw>0?'aw':'', (!own && !opts.force)?'off':'', (opts.team!==false && S.team.includes(id))?'in-team':''].join(' ');
  const hook = opts.act ? `data-act="${opts.act}" data-id="${id}"${opts.pressed!==undefined?` aria-pressed="${opts.pressed}"`:''}` : `data-hero="${id}"`;
  return `<button class="${cls}" ${hook} aria-label="${esc(h.th)} ระดับ ${RAR[h.rar].label}">
    <span class="rar">${RAR[h.rar].label}</span>${lv?`<span class="lv">Lv.${lv}</span>`:''}
    <span class="seal">${portrait(id, isMech(id))}<em>${h.ch}</em></span>${isMech(id)?'<span class="mechtag">จักรกล</span>':''}
    <span class="stars">${own||opts.force?(aw>0?'☾'.repeat(aw):stars(st)):''}</span>
    <span class="nm">${esc(h.th)}</span>${opts.extra||''}</button>`;
}
const tok = (id, extra='', mech) => `<span class="tok ${HERO[id].fac}" ${extra}>${portrait(id, mech===undefined?isMech(id):mech)}</span>`;

// ---------- AFK ----------
const AFK_CAP = 12*60; // minutes
// weekly rotating event: changes every Monday
const EVENTS=[
  {k:'afk',    th:'สัปดาห์ทัพเร่งพล',  ch:'军', desc:'เงินจากรางวัลออฟไลน์ ×2'},
  {k:'rateup', th:'เทศกาลอัญเชิญ',    ch:'召', desc:'เมื่อสุ่มได้ S+ มีโอกาส 50% เป็นขุนพลประจำสัปดาห์'},
  {k:'fish',   th:'เทศกาลตกปลา',      ch:'渔', desc:'แต้มปลาจากการตกปลา ×2'}
];
const weekNo = () => { const d=new Date(); d.setHours(0,0,0,0); return Math.floor((d.getTime()/864e5+3)/7) };
const curEvent = () => EVENTS[weekNo()%EVENTS.length];
const featuredSP = () => { const sp=HEROES.filter(h=>h.rar==='SP'); return sp[weekNo()%sp.length].id };
const evMul = k => curEvent().k===k ? 2 : 1;
function afkNow(){
  const mins = Math.min(AFK_CAP, (Date.now()-S.afkSince)/60000);
  return {mins, gold:Math.floor(mins*(20+S.stage*5)*evMul('afk')), exp:Math.floor(mins*(15+S.stage*4)), gems:Math.floor(mins/60)*10};
}
const hms = m => { const s=Math.floor(m*60); return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,'0')).join(':') };

// ---------- views ----------
let tab='city', selPick=null, roster={q:'', fac:'all', sort:'power', showAll:false};
const TASKS=[
  {k:'afk', th:'เก็บรางวัลออฟไลน์', goal:1, gems:100},
  {k:'win', th:'ชนะการต่อสู้', goal:3, gems:150},
  {k:'pull',th:'อัญเชิญขุนพล', goal:2, gems:150},
  {k:'lvl', th:'เลื่อนระดับขุนพล', goal:3, gems:100}
];
const taskDone = t => S.daily[t.k]>=t.goal;
const allDone = () => TASKS.every(taskDone);
function tasksClaimable(){ return TASKS.some(t=>taskDone(t)&&!S.daily.got[t.k]) || (allDone() && !S.daily.got.all) }

function renderTop(){
  $('#cgold').textContent=fmt(S.gold); $('#cgems').textContent=fmt(S.gems); $('#cexp').textContent=fmt(S.exp);
  $('#ppower').textContent=fmt(teamPower());
  document.querySelectorAll('#nav button').forEach(b=>{
    b.setAttribute('aria-current', b.dataset.go===tab?'page':'false');
    b.querySelector('.dot')?.remove();
    const need = (b.dataset.go==='city' && (tasksClaimable() || bagCount()>0 || loginReady())) || (b.dataset.go==='summon' && S.freeDate!==today()) || (b.dataset.go==='camp' && afkNow().mins>=60);
    if(need) b.insertAdjacentHTML('beforeend','<span class="dot"></span>');
  });
}

// World map: each chapter of 10 stages is a region; the route winds across the land.
const REGIONS = [
  {n:'ตุ้นก้วน', ch:'涿'}, {n:'ลกเอี๋ยง', ch:'洛'}, {n:'ซิจิ๋ว', ch:'徐'}, {n:'กัวต๋อ', ch:'官'}, {n:'ซินเอี๋ย', ch:'新'},
  {n:'เตียงปัน', ch:'长'}, {n:'ผาแดง', ch:'赤'}, {n:'เกงจิ๋ว', ch:'荆'}, {n:'เสฉวน', ch:'蜀'}, {n:'ฮันต๋ง', ch:'汉'},
  {n:'อิเหลง', ch:'夷'}, {n:'ลำเต๋ง', ch:'南'}, {n:'กิสาน', ch:'祁'}, {n:'อู่จั้ง', ch:'五'}, {n:'เตียงอัน', ch:'安'}
];
const regionOf = stage => Math.floor((stage-1)/10);
function viewMap(){
  const cur=regionOf(S.stage), shown=Math.max(cur+3, 6), pts=[];
  const H=Math.ceil(shown/3)*30+6;
  for(let i=0;i<shown;i++){ const row=Math.floor(i/3), col=row%2? 2-(i%3) : i%3; pts.push([18+col*32, 16+row*30]) }
  const path=pts.map((p,i)=>`${i?'L':'M'}${p[0]} ${p[1]}`).join(' ');
  return `<button class="back" data-go="camp">‹ กลับพิชิตศึก</button>
  <h1 class="h">แผนที่โลก <span class="sub">แคว้นที่ ${cur+1} · ${esc(REGIONS[cur%REGIONS.length].n)}</span></h1>
  <div class="wmap" style="aspect-ratio:100/${H}">
    <svg viewBox="0 0 100 ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${path}" fill="none" stroke="#8a6a3a" stroke-width="1.6" stroke-dasharray="3 2"/></svg>
    ${pts.map((p,i)=>{const r=REGIONS[i%REGIONS.length], st=i<cur?'done':i===cur?'cur':'lock';
      return `<button class="region ${st}" style="left:${p[0]}%;top:${p[1]/H*100}%" data-act="region" data-i="${i}" ${st==='lock'?'disabled':''}>
        <span class="rch">${r.ch}</span><b>${i+1}. ${esc(r.n)}</b><small>${st==='done'?'พิชิตแล้ว':st==='cur'?`ด่าน ${(S.stage-1)%10+1}/10`:'ล็อก'}</small></button>`}).join('')}
  </div>
  <div class="note">พิชิตครบ 10 ด่านของแคว้นได้หยก 200 และยา EXP 5 ขวด แคว้นถัดไปศัตรูแข็งขึ้น</div>
  <button class="btn red" style="width:100%" data-go="camp">ไปด่าน ${stageLabel(S.stage)}</button>`;
}

  <div class="maprow"><button class="btn ghost small" data-go="map">แผนที่โลก · แคว้น${esc(REGIONS[regionOf(S.stage)%REGIONS.length].n)}</button></div>
  <div class="scene" id="scene">
    ${campArt(S.stage)}

    <div class="march">${team.map(id=>tok(id)).join('')}</div>
    <div class="march foe-march">${foes.slice(0,3).map(f=>tok(f.id,'',false)).join('')}</div>

    <div class="chest" aria-hidden="true"></div>

      <div class="r"><span>เงิน +<b id="afkG">${fmt(a.gold)}</b></span><span>EXP +<b id="afkX">${fmt(a.exp)}</b></span><span>หยก +<b id="afkJ">${a.gems}</b></span></div>
    </div>

  <div class="note">ทัพของท่านลาดตระเวนเองแม้ปิดเกม สะสมรางวัลได้สูงสุด 12 ชั่วโมง</div>

      <div class="foes">${foes.map(f=>tok(f.id)).join('')}</div>

  <div class="note">ชนะแล้วได้ เงิน ${fmt(rw.gold)} · EXP ${fmt(rw.exp)} · หยก ${rw.gems}${S.stage%5===0?' (ด่านบอส)':''} และรางวัลออฟไลน์ต่อนาทีจะเพิ่มขึ้น</div>`;

function viewHeroes(){
  const q=roster.q.trim().toLowerCase();
  let list=HEROES.filter(h=> (roster.showAll||S.heroes[h.id]) && (roster.fac==='all'||h.fac===roster.fac) &&
     (!q || h.th.includes(roster.q.trim()) || h.en.toLowerCase().includes(q) || ROLE[h.role].th.includes(roster.q.trim()) || h.sk.includes(roster.q.trim())));

// Each player owns one shared document players/<their id>: their defence team, arena points,

const NET = {db:null, user:null, room:null, me:null, on:false, ro:false, players:{}, names:{}, online:[], msgs:[], hits:[], loaded:false, lastJSON:'', timer:0, tabSent:''};
const realPlayers = () => Object.entries(NET.players).filter(([id,d])=>id!==NET.me && Array.isArray(d.team) && d.team.some(Boolean)).map(([id,d])=>({uid:id, ...d}));

function myDoc(){
  return {v:1, team:S.team.map(id=>id?{id, lv:H(id).lv, star:H(id).star, aw:H(id).aw, bonus:heroBonus(id)}:null), power:teamPower(),

}
function syncSoon(){
  if(!NET.on || NET.ro || !NET.loaded) return;
  clearTimeout(NET.timer);
  NET.timer=setTimeout(async()=>{
    const d=myDoc(), j=JSON.stringify(d); if(j===NET.lastJSON) return;
    try{ await NET.db.doc('players/'+NET.me).set(d); NET.lastJSON=j }
    catch(e){ if(e&&e.code==='invalid_argument'){ NET.ro=true; render() } }
  }, 2500);
}
async function resolveNames(){
  if(!NET.user) return;
  const ids=[...new Set([...Object.keys(NET.players), ...NET.online.map(p=>p.by).filter(Boolean)])];
  if(!ids.length) return;
  NET.names=await NET.user.profiles(ids);
}
const NET_TABS=['arena','guild','chat','city'];
function netRender(){
  if(!NET_TABS.includes(tab)) return;
  if(tab==='chat' && document.activeElement?.id==='chatin'){ const log=$('#chatlog'); if(log){ log.innerHTML=chatLogHTML(); log.scrollTop=log.scrollHeight } return }
  if($('#layer').innerHTML) return; // don't disturb an open sheet or battle
  render();
}
async function initNet(){
  if(NET.started || !window.claude?.use) return; NET.started=true;
  const [db,user,room]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('room')]);
  NET.db=db; NET.user=user; NET.room=room;
  NET.me = user ? await user.id() : null;
  if(db && NET.me){
    NET.on=true;
    if(user){ const w=await user.can('data.write'); if(w===false) NET.ro=true }
    db.collection('players').onSnapshot(async snap=>{
      const next={}; for(const d of snap.docs) if(d.exists) next[d.id]=d.data();
      NET.players=next;
      if(!NET.loaded){ const mine=next[NET.me]; if(mine){ NET.msgs=[...(mine.msgs||[])]; NET.hits=[...(mine.hits||[])] } NET.loaded=true; syncSoon() }
      await resolveNames(); netRender();
    }, ()=>{ NET.on=false; netRender() });
  }
  if(room){
    room.onPeers(async ch=>{ NET.online=ch.peers.filter(p=>p.kind==='viewer'); await resolveNames(); netRender() });
    sendTab();
  }
  render();
}

function arenaOpps(){

let fishG=null, fishMsg='โยนเบ็ดแล้วกด “ดึงเบ็ด” ตอนเข็มอยู่ในช่องเขียว ช่องทองตรงกลางได้ปลาหายากง่ายขึ้น';
function viewFish(){
  const z=fishG?.zone??40, w=fishG?.w??22;
  return `${back()}
  <h1 class="h">บ่อตกปลา</h1>
  <div class="pond">${fishG?'<span class="line"></span><span class="bob"></span>':''}<div class="msg" id="fmsg">${esc(fishMsg)}</div></div>
  <div class="fishbar" aria-hidden="true"><span class="zone" style="left:${z}%;width:${w}%"></span><span class="mark" id="fmark" style="left:${fishG?.pos??0}%"></span></div>
  ${fishG?`<button class="btn red" style="width:100%;font:20px var(--f-display);padding:12px" data-act="pull">ดึงเบ็ด!</button>`
    :`<button class="btn" style="width:100%;font:20px var(--f-display);padding:12px" data-act="cast" ${S.fishing.casts<1?'disabled':''}>โยนเบ็ด (เหลือ ${S.fishing.casts} ครั้ง)</button>`}
  <div class="panel rates" style="margin-top:12px">
    ${FISH.map((f,i)=>`<div>${f.th}: ${f.pts} แต้ม${f.gems?` + หยก ${f.gems}`:''} · จับได้แล้ว <b>${S.fishing.log[i]}</b></div>`).join('')}
    <div style="margin-top:4px">ตกได้วันละ 5 ครั้ง ซื้อเหยื่อเพิ่มได้ที่ร้านค้า แต้มปลาใช้เลี้ยงสัตว์เทพ</div></div>`;
}
function fishLoop(){
  if(!fishG) return;
  fishG.pos+=fishG.dir*fishG.speed;
  if(fishG.pos>=100){fishG.pos=100;fishG.dir=-1} if(fishG.pos<=0){fishG.pos=0;fishG.dir=1}
  const m=$('#fmark'); if(m) m.style.left=fishG.pos+'%';
  fishG.raf=requestAnimationFrame(fishLoop);
}
function cast(){
  if(fishG||S.fishing.casts<1) return;
  S.fishing.casts--; save();
  const w=18+Math.floor(rng()*8);
  fishG={pos:0, dir:1, speed:0.9+rng()*0.7, zone:8+Math.floor(rng()*(84-w)), w};
  fishMsg='มีอะไรมากินเหยื่อแล้ว…'; render(); if(fishG) fishG.raf=requestAnimationFrame(fishLoop);
}
function pull(){
  if(!fishG) return; cancelAnimationFrame(fishG.raf);
  const {pos,zone,w}=fishG; fishG=null;
  const inZone=pos>=zone&&pos<=zone+w, perfect=pos>=zone+w*0.35&&pos<=zone+w*0.65;
  if(!inZone){ fishMsg='ปลาหลุดไปแล้ว ลองใหม่'; render(); return }
  const r=rng(), k = perfect ? (r<0.15?2:r<0.6?1:0) : (r<0.03?2:r<0.23?1:0), f=FISH[k];
  const fp=f.pts*evMul('fish'); S.fishPts+=fp; S.fishing.log[k]++; if(f.gems) S.gems+=f.gems; sfx('coin');
  fishMsg=`${perfect?'สมบูรณ์แบบ! ':''}ได้ ${f.th} +${fp} แต้ม${f.gems?` และหยก ${f.gems}`:''}`;
  save(); render();
}

// ---------- sound: everything synthesized live, no audio files ----------
const SND={on:false, ctx:null, master:null, music:null, sfx:null, mode:null, timer:0, step:0, next:0, nbuf:null};
try{ SND.on=localStorage.getItem('kp-sound')==='1' }catch(e){}
function audioInit(){
  if(SND.ctx) return true;
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false;
  const c=SND.ctx=new AC();
  SND.master=c.createGain(); SND.master.gain.value=.7; SND.master.connect(c.destination);
  SND.music=c.createGain(); SND.music.gain.value=.35; SND.music.connect(SND.master);
  SND.sfx=c.createGain(); SND.sfx.gain.value=.8; SND.sfx.connect(SND.master);
  const b=c.createBuffer(1,c.sampleRate*.5,c.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; SND.nbuf=b;
  return true;
}
function tone(freq, t, dur, o={}){
  const c=SND.ctx, osc=c.createOscillator(), g=c.createGain(), vol=o.vol??.2;
  osc.type=o.type||'triangle'; osc.frequency.setValueAtTime(freq,t); if(o.bend) osc.frequency.exponentialRampToValueAtTime(freq*o.bend,t+dur);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+(o.attack||.005)); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  osc.connect(g).connect(o.dest||SND.sfx); osc.start(t); osc.stop(t+dur+.05);
}
function noise(t, dur, vol, freq, dest){
  const c=SND.ctx, src=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
  src.buffer=SND.nbuf; f.type='bandpass'; f.frequency.value=freq; f.Q.value=.8;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  src.connect(f).connect(g).connect(dest||SND.sfx); src.start(t); src.stop(t+dur+.05);
}
function sfx(name){
  if(!SND.on||!SND.ctx) return;
  const t=SND.ctx.currentTime;
  switch(name){
    case 'click': tone(880,t,.05,{type:'square',vol:.04}); break;
    case 'hit': noise(t,.12,.35,1800); tone(150,t,.12,{type:'sine',vol:.28,bend:.5}); break;
    case 'crit': noise(t,.2,.5,3200); tone(240,t,.22,{type:'sawtooth',vol:.12,bend:.4}); break;
    case 'heal': [660,880,1175].forEach((f,i)=>tone(f,t+i*.06,.32,{type:'sine',vol:.1})); break;
    case 'skill': tone(98,t,1.6,{type:'sine',vol:.45}); tone(147,t,1.2,{type:'sine',vol:.22}); tone(523,t,.9,{vol:.06,bend:.97}); noise(t,.35,.22,600); break;
    case 'coin': tone(1320,t,.07,{type:'square',vol:.06}); tone(1760,t+.07,.16,{type:'square',vol:.06}); break;
    case 'pull': [587,740,880,1175].forEach((f,i)=>tone(f,t+i*.07,.4,{vol:.1})); break;
    case 'sp': [587,659,740,880,988,1175].forEach((f,i)=>tone(f,t+i*.08,.5,{vol:.13})); tone(98,t+.5,1.8,{type:'sine',vol:.4}); break;
    case 'win': [587,659,880,988,1175].forEach((f,i)=>tone(f,t+i*.12,.45,{vol:.16})); break;
    case 'lose': [440,392,330,294].forEach((f,i)=>tone(f,t+i*.18,.55,{type:'sine',vol:.14})); break;
  }
}
// D pentatonic, the classic sound of Chinese folk melodies
const PENTA=[293.66,329.63,369.99,440,493.88,587.33,659.25,739.99,880,987.77];
const SONGS={
  city:{bpm:84, mel:[5,-1,4,2,-1,4,5,7, 6,-1,5,4,2,-1,1,-1, 2,4,5,-1,7,6,5,-1, 4,-1,2,1,0,-1,-1,-1], bass:[73.42,55,61.74,55]},
  battle:{bpm:138, mel:[0,2,4,2,5,4,2,4, 0,2,4,5,7,5,4,2, 5,7,8,7,5,4,5,-1, 4,2,1,2,4,-1,0,-1], bass:[73.42,73.42,65.41,55], drum:true}
};
function musicTick(){
  const c=SND.ctx, song=SONGS[SND.mode]; if(!c||!song) return;
  const sd=60/song.bpm/2;
  while(SND.next < c.currentTime+.2){
    const i=SND.step%song.mel.length, n=song.mel[i], t=SND.next;
    if(n>=0){ tone(PENTA[n],t,.7,{vol:.13,dest:SND.music}); tone(PENTA[n]*2,t,.22,{type:'sine',vol:.035,dest:SND.music}) }
    if(i%8===0) tone(song.bass[(i/8)%song.bass.length],t,sd*7,{type:'sine',vol:.2,dest:SND.music});
    if(song.drum && i%4===0){ tone(70,t,.25,{type:'sine',vol:.35,bend:.6,dest:SND.music}); noise(t,.08,.15,900,SND.music) }
    if(song.drum && i%4===2) noise(t,.05,.08,4000,SND.music);
    SND.next+=sd; SND.step++;
  }
}
function setMusic(mode){
  if(SND.mode===mode && SND.timer) return;
  SND.mode=mode; clearInterval(SND.timer); SND.timer=0;
  if(!SND.on||!SND.ctx) return;
  SND.step=0; SND.next=SND.ctx.currentTime+.05; SND.timer=setInterval(musicTick,50); musicTick();
}
function toggleSound(){
  if(!audioInit()) return toast('เบราว์เซอร์นี้เล่นเสียงไม่ได้');
  SND.ctx.resume?.();
  SND.on=!SND.on; try{localStorage.setItem('kp-sound',SND.on?'1':'0')}catch(e){}
  const b=$('#sndbtn'); if(b){ b.classList.toggle('off',!SND.on); b.setAttribute('aria-pressed',SND.on) }
  if(SND.on) setMusic(B&&!B.done?'battle':'city'); else { clearInterval(SND.timer); SND.timer=0 }
}

function buy(k){
  sfx('coin');
  const it=SHOP.find(x=>x.k===k), c=it.cost, g=it.give;
  if((c.gold||0)>S.gold||(c.gems||0)>S.gems) return;
  S.gold-=c.gold||0; S.gems-=c.gems||0;
  let msg=`ซื้อ ${it.th} แล้ว`;
  if(g.exp) S.exp+=g.exp; if(g.fish) S.fishPts+=g.fish; if(g.tickets) S.tickets+=g.tickets;
  if(g.casts) S.fishing.casts+=g.casts;
  if(g.shards){ const pool=HEROES.filter(h=>h.rar==='S'), sh=pool[Math.floor(rng()*pool.length)]; addShards(sh.id,g.shards); msg=`ได้เศษ${sh.th} ×${g.shards}` } if(g.arena) S.arena.left+=g.arena;
  if(g.gear!==undefined){ const n=newGear(Math.max(S.stage,S.tower*1.5), g.gear); msg=`ได้ ${gearName(n)}` }
  save(); render(); toast(msg);
}

// ---------- gear on heroes ----------
function levelUp(id, n){
  const h=H(id); let k=0;
  while(k<n){ const c=lvCost(h.lv, HERO[id].role); if(h.lv>=levelCap(h.star,h.aw)||S.gold<c.gold||S.exp<c.exp) break; S.gold-=c.gold; S.exp-=c.exp; h.lv++; S.daily.lvl++; k++ }
  return k;
}
function autoGear(id){
  const h=H(id);
  for(const sl of SLOTS){
    const cur=h.eq[sl.k]?gearById(h.eq[sl.k]):null;
    const best=S.gear.filter(g=>g.slot===sl.k && !gearOwner(g.uid)).sort((a,b)=>gearScore(b)-gearScore(a))[0];
    if(best && (!cur || gearScore(best)>gearScore(cur))) h.eq[sl.k]=best.uid;
  }
}
function equip(id, uid){
  const g=gearById(uid), o=gearOwner(uid);
  if(o) delete H(o).eq[g.slot];
  H(id).eq[g.slot]=uid;
}
function openGearSlot(id, slot){
  const h=H(id), cur=h.eq[slot]?gearById(h.eq[slot]):null, sl=SLOTS.find(s=>s.k===slot);
  const list=S.gear.filter(g=>g.slot===slot && g.uid!==cur?.uid).sort((a,b)=>gearScore(b)-gearScore(a));
  $('#layer').innerHTML=`<div class="veil" data-act="close"><div class="sheet" data-stop role="dialog" aria-modal="true" aria-label="${sl.th}">
    <h2>${sl.th} · ${esc(HERO[id].th)}</h2>

    <div class="en" style="margin-top:8px">เลือกสวม (${list.length})</div>

function shrinePull(n){
  const id=S.shrinePick; if(!id) return toast('เลือกขุนพลก่อน');
  if(S.tickets<n) return toast('ตั๋วทะลวงไม่พอ ผ่านหอท้าขุนพลหรือแลกด้วยหยก');
  S.tickets-=n;
  const out={soul:0,copy:0,gold:0,exp:0};
  for(let i=0;i<n;i++){
    S.shrinePity++;
    const r=rng(); let k = r<0.05?'soul': r<0.30?'copy': r<0.65?'gold':'exp';
    if(S.shrinePity>=10) k='soul';
    if(k==='soul'){out.soul++; S.shrinePity=0}
    else if(k==='copy') out.copy++;
    else if(k==='gold') out.gold+=3000+S.stage*100;
    else out.exp+=2000+S.stage*80;
  }
  let fresh=false;
  if(out.copy>0 && !H(id)){ S.heroes[id]={lv:1,star:1,copies:0,aw:0,eq:{}}; out.copy--; fresh=true }
  if(H(id)) H(id).copies+=out.copy; else out.lost=out.copy;
  S.souls[id]=(S.souls[id]||0)+out.soul; S.gold+=out.gold; S.exp+=out.exp + (out.lost||0)*1500;
  save(); render();
  const nm=esc(HERO[id].th);
  $('#layer').innerHTML=`<div class="reveal" role="dialog" aria-label="ผลการทะลวง">
    <div class="h" style="margin:0">ผลการทะลวง ${n} ครั้ง</div>
    <div class="loot-list">
      ${out.soul?`<span class="hot"><i class="coin t"></i>ผลึกจิตแดง ${nm} ×${out.soul}</span>`:''}
      ${fresh?`<span class="hot">ได้รับขุนพล ${nm}!</span>`:''}
      ${out.copy?`<span>สำเนา ${nm} ×${out.copy}</span>`:''}
      ${out.lost?`<span>สำเนา ×${out.lost} แปลงเป็น EXP</span>`:''}
      ${out.gold?`<span><i class="coin g"></i>+${fmt(out.gold)}</span>`:''}
      ${out.exp?`<span><i class="coin x"></i>+${fmt(out.exp)}</span>`:''}
    </div>
    <div style="display:flex;gap:10px"><button class="btn" data-act="close">รับทราบ</button>${S.tickets>=n?`<button class="btn ghost" data-act="sh${n}">อีก ${n} ครั้ง</button>`:''}</div>
  </div>`;
}

  {t:'อัญเชิญขุนพลได้ฟรีวันละครั้ง ไปหน้า "อัญเชิญ" แล้วกด "อัญเชิญ 1 ครั้ง"', tab:'summon', sel:'[data-act="pull1"]', done:()=>S.pulls>0},
  {t:'เยี่ยมมาก ท่านเจ้าเมือง! เมืองหลักยังมีเนื้อเรื่อง หอท้า ประลอง กิลด์ และอีกมาก ค่อย ๆ สำรวจได้เลย', tab:null, sel:null, done:()=>false, last:true}
];
function tutorial(){
  document.querySelectorAll('.tut-hl').forEach(e=>e.classList.remove('tut-hl'));
  $('#tutor')?.remove();
  if(S.tut>=TUT.length) return;
  while(S.tut<TUT.length && TUT[S.tut].done()){ S.tut++; save() }
  if(S.tut>=TUT.length) return;
  const st=TUT[S.tut];
  const target = st.tab && tab!==st.tab ? `#nav [data-go="${st.tab}"]` : st.sel;
  if(target) document.querySelector(target)?.classList.add('tut-hl');
  const box=document.createElement('div'); box.id='tutor'; box.className='tutor';
  box.innerHTML=`<span class="tok shu">${portrait('liubei_y')}</span><div><b>ขั้นที่ ${S.tut+1}/${TUT.length}</b><p></p>
    <div class="tutbtns">${st.last?'<button class="btn small" data-act="tutnext">เริ่มเล่น</button>':'<button class="btn ghost small" data-act="tutskip">ข้ามการสอน</button>'}</div></div>`;
  box.querySelector('p').textContent=st.t;
  $('#app').appendChild(box);
}

function doPull(n){
  const free = n===1 && S.freeDate!==today();
  const cost = n===10?2700:300;
  if(!free && S.gems<cost) return toast('หยกไม่พอ ผ่านด่านหรือทำภารกิจเพื่อรับเพิ่ม');
  if(free) S.freeDate=today(); else S.gems-=cost;
  const got=[];
  for(let i=0;i<n;i++){
    S.pulls++; S.pityS++; S.pitySP++;
    const r=rng(); let rar = r<0.03?'SP': r<0.23?'S':'A';
    if(S.pitySP>=60) rar='SP'; else if(S.pityS>=10 && rar==='A') rar='S';
    if(rar!=='A') S.pityS=0; if(rar==='SP') S.pitySP=0;
    const pool=HEROES.filter(h=>h.rar===rar); let h=pool[Math.floor(rng()*pool.length)];
    if(rar==='SP' && curEvent().k==='rateup' && rng()<0.5) h=HERO[featuredSP()];
    const isNew=!S.heroes[h.id];
    if(isNew) S.heroes[h.id]={lv:1,star:1,copies:0,aw:0,eq:{}}; else S.heroes[h.id].copies++;
    got.push({id:h.id,isNew});
  }
  S.daily.pull+=n; save(); render();
  setTimeout(()=>sfx(got.some(g=>HERO[g.id].rar==='SP')?'sp':'pull'),120);
  $('#layer').innerHTML=`<div class="reveal" role="dialog" aria-label="ผลการอัญเชิญ">
    <div class="h" style="margin:0">ผลการอัญเชิญ</div>
    <div class="grid" style="${n===1?'grid-template-columns:minmax(0,120px);justify-content:center':''}">${got.map((g,i)=>cardHTML(g.id,{team:false,force:true,lv:S.heroes[g.id].lv,star:S.heroes[g.id].star,extra:g.isNew?'<span class="tagnew">ใหม่!</span>':'<span class="tagdup">+1 สำเนา</span>'}).replace('class="card','style="animation-delay:'+(i*0.08)+'s" class="card')).join('')}</div>
    <div style="display:flex;gap:10px"><button class="btn" data-act="close">รับทราบ</button>${S.gems>=cost?`<button class="btn ghost" data-act="${n===10?'pull10':'pull1'}">อีก ${n} ครั้ง</button>`:''}</div>
  </div>`;
}

function autoTeam(){
  const owned=Object.keys(S.heroes).sort((a,b)=>heroPower(b)-heroPower(a));
  const fronters=owned.filter(id=>['war','cav'].includes(HERO[id].role));
  const team=[null,null,null,null,null,null];
  fronters.slice(0,3).forEach((id,i)=>team[i]=id);
  const rest=owned.filter(id=>!team.includes(id));
  let k=0; for(let i=0;i<6;i++){ if(!team[i] && rest[k]) team[i]=rest[k++] }
  S.team=team; save(); render(); toast('จัดทัพจากขุนพลที่แรงที่สุดแล้ว');
}

function toggleTeam(id){
  const i=S.team.indexOf(id);
  if(i>=0){ if(S.team.filter(Boolean).length<=1) return toast('ทัพต้องมีขุนพลอย่างน้อย 1 คน'); S.team[i]=null }
  else {
    const prefFront=['war','cav'].includes(HERO[id].role);
    const order=prefFront?[0,1,2,3,4,5]:[3,4,5,0,1,2];
    const free=order.find(j=>!S.team[j]);
    if(free===undefined) return toast('ทัพเต็ม 6 คนแล้ว ถอนใครออกก่อน');
    S.team[free]=id;
  }
  save(); render(); openHero(id);
}

        <span style="display:flex;gap:6px"><button class="btn ghost" data-act="speed" id="spd">x1</button><button class="btn ghost" data-act="skip">ข้าม</button></span></div>
